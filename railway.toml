# Railway — API desde la raíz del repo (si Root Directory no está en backend)
# Instala y arranca SOLO backend/, nunca Next.js.

[build]
builder = "NIXPACKS"
buildCommand = "npm install --prefix backend && npm run build --prefix backend"

[deploy]
startCommand = "npm run railway:start --prefix backend"
restartPolicyType = "ON_FAILURE"
